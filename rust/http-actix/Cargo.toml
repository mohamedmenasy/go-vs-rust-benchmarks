[package]
name = "bench-http-actix"
description = "Secondary Rust HTTP server: Actix Web (mirror of go/http-gin)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "http-actix"
path = "src/main.rs"

[features]
alloc-stats = ["bench-common/alloc-stats"]
mimalloc = ["bench-common/mimalloc"]

[dependencies]
actix-web.workspace = true
bench-common.workspace = true
http-common.workspace = true
