[workspace]
resolver = "3"
members = ["common", "concurrency", "cpu", "http-actix", "http-axum", "http-common", "io", "json", "memory", "selftest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bench-common = { path = "common" }
http-common = { path = "http-common" }
actix-web = { version = "4.15", default-features = false, features = ["macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
async-channel = "2.5"
reqwest = { version = "0.13", default-features = false }
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# The stock `cargo build --release` settings, written out explicitly so the
# configuration under test is visible and does not silently change with a
# future Cargo release. `strip` is deliberately left at Cargo's default
# ("debuginfo" when debug = false). This is the profile of the baseline track.
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false            # Cargo's default: thin-local LTO within each crate
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

# Tuned track only (never used for baseline comparisons): whole-program fat
# LTO, a single codegen unit and abort-on-panic, as many production Rust
# services configure it.
[profile.release-tuned]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
