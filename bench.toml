# ===========================================================================
# 3. JSON (single core; op mode: every document timed individually)
#    Go encoding/json (v1 API; Go 1.27 backs it with the json/v2 engine by
#    default) vs Rust serde + serde_json. Output must be byte-identical.
# ===========================================================================

[[workload]]
id = "json.decode"
category = "json"
bin = "json"
impl = "decode"
cores = "single"
desc = "Typed decode (Go json.Unmarshal into structs; Rust serde_json::from_slice with #[derive(Deserialize)]). The decoded value replaces the previous one (Rust drop / Go garbage are part of the cost)."
sizes = [
  { label = "obj-1KiB", input = "json/object-1KiB.json", schema = "object", profiles = ["quick", "standard", "full"] },
  { label = "obj-10KiB", input = "json/object-10KiB.json", schema = "object", profiles = ["standard", "full"] },
