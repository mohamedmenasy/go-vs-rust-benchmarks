[[workload]]
id = "mem.binarytrees"
category = "memory"
bin = "memory"
impl = "binarytrees"
cores = "memory"
desc = "Benchmarks Game binary-trees (single-threaded): a long-lived tree plus many short-lived trees of depth 4..D; 16-byte nodes, pointer-rich."
notes = "Sized by tree depth, not bytes: this is an allocation-throughput benchmark with a small live heap."
timing = { quick = { warmup_iters = 1, warmup_min_ms = 0, iters = 2, min_ms = 0 }, standard = { warmup_iters = 2, warmup_min_ms = 0, iters = 3, min_ms = 1000 }, full = { warmup_iters = 2, warmup_min_ms = 0, iters = 5, min_ms = 2000 } }
