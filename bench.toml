  { label = "d20", depth = 20, profiles = ["full"] },
]

[[workload]]
id = "mem.churn"
category = "memory"
bin = "memory"
impl = "churn"
cores = "memory"
desc = "Steady-state churn: a live set of boxed 64-byte objects (built in setup) while each run replaces as many random slots as there are objects with fresh ones."
notes = "The GC-sensitive case: Go must repeatedly mark the whole live set; Rust frees each replaced object immediately."
timing = { quick = { warmup_iters = 1, warmup_min_ms = 0, iters = 2, min_ms = 0 }, standard = { warmup_iters = 2, warmup_min_ms = 0, iters = 3, min_ms = 1000 }, full = { warmup_iters = 2, warmup_min_ms = 0, iters = 5, min_ms = 2000 } }
