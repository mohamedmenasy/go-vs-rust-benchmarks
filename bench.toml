# ===========================================================================
# 2. Memory (2 cores so Go's concurrent GC has room; METHODOLOGY.md §13.2)
#    Allocation, use and release are all inside the timed run.
# ===========================================================================

[[workload]]
id = "mem.bytes"
category = "memory"
bin = "memory"
impl = "bytes"
cores = "memory"
desc = "Allocate one contiguous buffer, fill it with SplitMix64 words, fold it, release it."
notes = "Go's make() zero-initialises by language definition; the Rust version collects into a fresh Vec without zeroing. glibc serves these sizes with mmap/munmap per iteration; Go reuses its heap after GC."
timing = { quick = { warmup_iters = 1, warmup_min_ms = 0, iters = 2, min_ms = 0 }, standard = { warmup_iters = 2, warmup_min_ms = 0, iters = 3, min_ms = 1000 }, full = { warmup_iters = 2, warmup_min_ms = 0, iters = 5, min_ms = 2000 } }
sizes = [
  { label = "100MiB", bytes = "100MiB", profiles = ["quick", "standard", "full"] },
  { label = "500MiB", bytes = "500MiB", profiles = ["standard", "full"] },
  { label = "1GiB", bytes = "1GiB", profiles = ["standard", "full"] },
]

[[workload]]
id = "mem.objects-boxed"
category = "memory"
bin = "memory"
impl = "objects-boxed"
cores = "memory"
desc = "Allocate bytes/64 individually heap-allocated 64-byte objects held by a slice/Vec of pointers, read them, release them (Go: garbage for the GC; Rust: Box drops)."
