# ===========================================================================
# 4. HTTP (METHODOLOGY.md §13.4): server on http_server cores, wrk/wrk2 on
#    http_loadgen cores. Driven by scripts/benchctl/http.py.
# ===========================================================================
[http]
port = 18080
timeout_s = 5
sample_ms = 250
latency_connections = 100
rates = [0.25, 0.5, 0.75, 0.9]

[http.quick]
rounds = 1
secondary_rounds = 1
warmup_s = 3
duration_s = 8
connections = [10, 100, 1000]
secondary_connections = [100]
latency_rounds = 1
latency_warmup_s = 3
latency_duration_s = 10
rates = [0.5, 0.9]
sustained = [{ connections = 100, duration_s = 20, window_s = 10 }]

[http.standard]
rounds = 5
secondary_rounds = 3
warmup_s = 10
duration_s = 30
connections = [1, 10, 100, 500, 1000, 5000, 10000]
secondary_connections = [10, 100, 1000, 5000]
latency_rounds = 3
latency_warmup_s = 10
latency_duration_s = 60
sustained = [{ connections = 100, duration_s = 60, window_s = 10 }, { connections = 100, duration_s = 300, window_s = 10 }]

[http.full]
rounds = 10
secondary_rounds = 5
warmup_s = 10
duration_s = 60
connections = [1, 10, 100, 500, 1000, 5000, 10000]
secondary_connections = [1, 10, 100, 500, 1000, 5000, 10000]
latency_rounds = 5
latency_warmup_s = 10
latency_duration_s = 120
sustained = [{ connections = 100, duration_s = 300, window_s = 10 }, { connections = 1000, duration_s = 300, window_s = 10 }]

[[workload]]
id = "http.users"
category = "http"
kind = "http"
impl = { go = "http", rust = "http-axum" }
cores = "http_server"
